# =========================================================
# AUTO-IMPROVE 24/7 — Team Robots Legends (FUSAMO)
# The robot plays REAL simulated matches against itself, tries
# tuning candidates for weapon constants (ci/autotune.json) and
# if (and only if) the measured score improves, pushes a branch
# and opens a PR (or an issue with the evidence when PRs are
# disabled for Actions in the repo settings).
# The robot proposes 🤝 the team decides (humans merge).
# =========================================================
name: auto-improve

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 */3 * * *"    # every 3 hours, offset from the battery
  workflow_dispatch: {}       # "Run workflow" button to fire it now

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  improve:
    name: Play matches → tune constants → propose PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Autotune (math matches + candidates)
        id: tune
        run: |
          set +e
          python3 ci/autotune.py > /tmp/autotune_run.log 2>&1
          rc=$?
          tee autotune_report_run.log < /tmp/autotune_run.log
          echo "autotune exit code: $rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo "applied=$(cat /tmp/autotune_applied 2>/dev/null || echo no)" >> "$GITHUB_OUTPUT"

      - name: Attach the tuning report
        if: always()
        run: cat /tmp/autotune_report.md 2>/dev/null || true >> "$GITHUB_STEP_SUMMARY"

      - name: Save tuning logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotune-logs
          path: |
            autotune_report_run.log
            /tmp/autotune_run.log
            /tmp/autotune_report.md
          retention-days: 90
        continue-on-error: true

      - name: Propose improvement (PR, fallback issue)
        if: steps.tune.outputs.applied == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "Proposed branch: $REPO_URL/tree/$BR"
            echo ""
          } >> /tmp/autotune_report.md
          git config user.name "Team Robots Legends"
          git config user.email "teamrobotslegends@fusamo.local"
          BR="auto-improve/$(date +%Y%m%d-%H%M)"
          {
            echo BR="$BR"
            echo "## 🤖 Autotune proposal"
            echo ""
            cat /tmp/autotune_report.md
          } > /tmp/issue.md
          git checkout -b "$BR"
          git add -A
          git -c commit.gpgsign=false commit -m "🤖 Autotune: constants improved in simulated matches"
          git push -u origin "$BR"
          if ! gh pr create --repo "${{ github.repository }}" --draft --head "$BR" \
               --title "🤖 Autonomous tuning proposal — simulated match evidence" \
               --body-file /tmp/autotune_report.md 2>/dev/null; then
            echo "PR creation not permitted for Actions; opening an issue with the evidence instead."
            gh issue create --repo "${{ github.repository }}" \
              --title "🤖 Autotune ready to bundle: review branch $BR" \
              --body-file /tmp/issue.md
          fi

      - name: Publish releases for tags whose notes exist (backfill)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git fetch origin --tags --force >/dev/null 2>&1 || true
          for f in .github/releases/v*.md; do
            [ -e "$f" ] || continue
            TAG="$(basename "$f" .md)"
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "tag $TAG missing -- skip"; continue; }
            gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1
            if [ $? -eq 0 ]; then
              echo "release $TAG already published -- skip"
              continue
            fi
            echo "publishing release $TAG"
            __GC__ "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG -- XRP-V1 robot upgrades" \
              --notes-file "$f"
            echo "backfill $TAG exit code: $?"
          fi
          # attach the robot files of THAT exact tag as a zip asset
          FILES="$(git ls-tree --name-only "$TAG" | grep -E '^(weapon|pilot_gamepad|main_match)' | tr '\n' ' ')"
          if [ -n "$FILES" ]; then
            git archive "$TAG" -o "/tmp/xrp-robot-${TAG}.zip" $FILES
            gh release upload "$TAG" "/tmp/xrp-robot-${TAG}.zip" --repo "${{ github.repository }}" --clobber
            echo "asset upload $TAG exit code: $?"
          fi
          done
