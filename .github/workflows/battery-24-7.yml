# =========================================================
# 24/7 BATTERY MARATHON — Team Robots Legends (FUSAMO)
# Plays the ENTIRE robot package around the clock:
#   • each run is a ~5 h 54 min marathon of back-to-back batteries
#   • then it PAUSES 1 minute and RE-TRIGGERS itself (24/7 chain)
#   • a daily cron is kept only as a safety re-arm if the chain ever dies;
#     pushes DO NOT launch it (a push would only queue a confusing
#     pending/cancelled marathon behind the live one) — use the
#     "Run workflow" button to fire it manually
# If a metric drops below its threshold the cycle is marked RED in the
# run summary; artifacts keep every cycle log (90 days) so the team can
# review the cause and EDIT pilot/weapons (never the tests).
# =========================================================
name: batteries-24-7

on:
  schedule:
    - cron: "40 3 * * *"           # safety re-arm once a day (UTC): even if the
                                   # self-trigger ever fails, a new marathon starts soon
  workflow_dispatch: {}            # "Run workflow" button to fire it now

concurrency:
  group: batteries-24-7      # never two marathons at once; the next waits its turn
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  marathon:
    name: Marathon batteries (~6 h loop) — Iron Acres + SUMO + SUMO2 + SOCCER + SOCCER2 + DRIVE
    runs-on: ubuntu-latest
    timeout-minutes: 366
    env:
      BATTERY_LOGS: /tmp/logs
    steps:
      - uses: actions/checkout@v4

      - name: Continuous batteries loop (~5 h 54 min) + 1 min pause + self re-arm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔗 CHAIN STATUS — last marathons of batteries-24-7:"
          gh run list --repo "${{ github.repository }}" --workflow batteries-24-7 \
            --limit 6 || echo "(could not list runs — not fatal, continuing)"
          mkdir -p /tmp/logs
          START=$(date +%s)
          DEADLINE=$((START + 5 * 3600 + 54 * 60))
          CYCLE=0
          FAILS=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            CYCLE=$((CYCLE + 1))
            LOG="/tmp/logs/cycle-$CYCLE.txt"
            echo "== BATTERY CYCLE $CYCLE  ($(date -u +%H:%M:%S) UTC) =="
            if bash ci/battery.sh > "$LOG" 2>&1; then
              echo "cycle $CYCLE: ✅ ALL OK"
            else
              FAILS=$((FAILS + 1))
              echo "cycle $CYCLE: ❌ FAILURES (see $LOG)"
              tail -25 "$LOG"
            fi
            {
              echo "## Cycle $CYCLE — $(date -u +%Y-%m-%d %H:%M UTC)"
              tail -3 "$LOG" | sed 's/^/    /'
              echo ""
              grep -E '^\|' /tmp/summary.md 2>/dev/null | tail -14 || true
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            cp "$LOG" /tmp/logs/last.txt
          done
          echo "== MARATHON DONE: $CYCLE cycles, $FAILS failing =="
          echo "## 🤖 Marathon total: $CYCLE cycles, $FAILS failing" >> "$GITHUB_STEP_SUMMARY"
          echo "💤 Pausing 1 minute, then re-arming the 24/7 chain…"
          sleep 60
          if ! gh workflow run batteries-24-7 --repo "${{ github.repository }}" \
               --ref main; then
            echo "⚠️ self re-arm failed — the 6-hour cron backbone will fire the next"
            echo "   marathon anyway (40 0,6,12,18 * * *). The chain never dies."
          else
            echo "✅ next marathon armed — chain continues"
          fi

      - name: Save marathon cycle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-cycles
          path: /tmp/logs
          retention-days: 90
