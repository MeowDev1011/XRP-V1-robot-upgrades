# =========================================================
# 24/7 BATTERY — Team Robots Legends (FUSAMO)
# Every 3 hours (or on demand) it plays the full package:
#   Iron Acres (300 KID matches + 100 ADULT + 100 NO_ASSIST)
#   DRIVE / SUMO / SUMO2 / SOCCER / SOCCER2 (100 KID)
#   30-match stress + 12 math unit tests
# If a metric drops below its threshold the run goes RED and
# the log of each battery is kept as an artifact to review
# the cause and EDIT pilot/weapons (never the tests).
# =========================================================
name: batteries-24-7

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */3 * * *"     # every 3 hours, 24/7
  workflow_dispatch: {}       # "Run workflow" button to fire it now

permissions:
  contents: read

jobs:
  batteries:
    name: Iron Acres + SUMO + SUMO2 + FUTBOL + FUTBOL2 + DRIVE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Play the full package (with quality thresholds)
        id: battery
        run: |
          export BATTERY_LOGS="$RUNNER_TEMP/logs"
          mkdir -p "$BATTERY_LOGS"
          bash ci/battery.sh | tee "$BATTERY_LOGS/output.txt"
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save battery logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-logs
          path: ${{ runner.temp }}/logs
          retention-days: 90
