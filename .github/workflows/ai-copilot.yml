# =========================================================
# 🧠 AI COPILOT — Team Robots Legends (FUSAMO)
# Manual copilot runs in the cloud: the AI reads the results of
# the battery and the code, and delivers analysis / plan / review
# / proposed improvements as an artifact + an Issue.
#
# REQUIRES: add your Groq key as the repository secret `GROQ_TOKEN`
# (Settings → Secrets and variables → Actions). Without the secret
# the run stays green but SKIPS the AI call.
# The copilot PROPOSES; humans review and simulate before touching
# pilot/weapons (never the tests or F-metrics).
# =========================================================
name: ai-copilot

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Copilot task"
        type: choice
        default: analyze
        options: [analyze, plan, review, ask, improve]
      question:
        description: "Question / target file (for ask / improve)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  copilot:
    name: 🧠 AI Copilot run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Quick battery context (fast tests only)
        run: |
          python3 verify.py > /tmp/verify.log 2>&1 || true
          python3 stress.py > /tmp/stress.log 2>&1 || true
          MASS_N=30 MASS_W=2 MASS_PILOT=KID python3 mass_campaign.py \
            > /tmp/mass_kid.log 2>&1 || true
          {
            echo "| check | result |"
            echo "|---|---|"
            echo "| verify | $(grep -o 'ALL TESTS PASS (12/12)' /tmp/verify.log | head -1) |"
            echo "| stress | $(grep -o 'RESULT: 30/30 matches approved' /tmp/stress.log | head -1) |"
            grep -E 'POINTS|PARK in zone|STRICT|Faults' /tmp/mass_kid.log \
              | sed 's/^/| /' || true
          } > /tmp/summary.md

      - name: Run the copilot
        id: copilot
        env:
          GROQ_TOKEN: ${{ secrets.GROQ_TOKEN }}
        run: |
          if [ -z "$GROQ_TOKEN" ]; then
            echo "SKIP (no GROQ_TOKEN secret). Add it in Settings → Secrets → Actions."
            echo "skipped=yes" >> "$GITHUB_OUTPUT"
          else
            mkdir -p /tmp/copilot
            python3 ai_copilot.py "${{ github.event.inputs.task }}" \
              "${{ github.event.inputs.question }}" \
              --save /tmp/copilot/answer.md
            echo "skipped=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Show + save the answer as artifact
        if: steps.copilot.outputs.skipped == 'no'
        run: cat /tmp/copilot/answer.md

      - name: Upload the answer artifact
        if: steps.copilot.outputs.skipped == 'no'
        uses: actions/upload-artifact@v4
        with:
          name: ai-copilot-answer
          path: /tmp/copilot/answer.md
          retention-days: 90

      - name: Open an issue with the answer
        if: steps.copilot.outputs.skipped == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/issue-body.md <<EOF
          🧠 AI Copilot run — task: \`${{ github.event.inputs.task }}\`

          $(cat /tmp/copilot/answer.md)

          ---
          🤝 The copilot proposes; the team decides. Verify against the battery
          before touching \`pilot_gamepad.py\` / \`weapon*.py\` (never the tests).
          EOF
          gh issue create --repo "${{ github.repository }}" \
            --title "🧠 AI Copilot: ${{ github.event.inputs.task }}" \
            --body-file /tmp/issue-body.md
