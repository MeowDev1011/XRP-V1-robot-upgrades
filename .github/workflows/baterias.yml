# =========================================================
# BATERIA 24/7 — Team Robots Legends (FUSAMO)
# Cada 3 horas (o a pedido) juega el paquete completo:
#   Iron Acres (300 partidas KID + 100 ADULTO + 100 SIN_ASIST)
#   CONDUCIR / SUMO / SUMO2 / FUTBOL / FUTBOL2 (100 KID)
#   estres 30 partidas + 12 pruebas unitarias
# Si una metrica cae de su umbral, el run queda EN ROJO y los
# logs de cada bateria quedan como artefactos para revisar la
# causa y EDITAR piloto/armas (nunca las pruebas).
# =========================================================
name: baterias-24-7

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */3 * * *"     # cada 3 horas, 24/7
  workflow_dispatch: {}       # boton "Run workflow" para correr al momento

permissions:
  contents: read

jobs:
  baterias:
    name: Iron Acres + SUMO + SUMO2 + FUTBOL + FUTBOL2 + CONDUCIR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Jugar el paquete completo (con umbrales de calidad)
        id: bateria
        run: |
          export BATERIA_LOGS="$RUNNER_TEMP/logs"
          mkdir -p "$BATERIA_LOGS"
          bash ci/bateria.sh | tee "$BATERIA_LOGS/salida.txt"
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar logs de las baterias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-bateria
          path: ${{ runner.temp }}/logs
          retention-days: 90
