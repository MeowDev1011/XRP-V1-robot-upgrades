<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Robots Legends — 3D Sandbox</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --panel: rgba(10,14,28,0.85); --edge: rgba(120,150,255,0.18); }
  html, body { height: 100%; }
  #stage { position: fixed; inset: 0; z-index: 0; }
  .hud {
    position: fixed; top: 68px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 10px; align-items: center; pointer-events: none; flex-wrap: wrap; justify-content: center;
  }
  .hud .box {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
    padding: 8px 14px; font-weight: 700; font-size: 15px; backdrop-filter: blur(8px);
    display: flex; align-items: center; gap: 7px;
  }
  .hud .box em { font-style: normal; color: var(--acc2); }
  #energy-wrap { width: 120px; height: 10px; background: rgba(255,255,255,.09); border-radius: 6px; overflow: hidden; }
  #energy { height: 100%; width: 100%; background: linear-gradient(90deg,#22d3a8,#4f8cff); transition: width .08s linear; }
  #topright { position: fixed; top: 68px; right: 14px; z-index: 10; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  #minimap { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; backdrop-filter: blur(8px); }
  .mini-btns { display: flex; gap: 6px; }
  .mini-btns button {
    background: var(--panel); border: 1px solid var(--edge); color: #fff; border-radius: 10px;
    padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 700; backdrop-filter: blur(8px);
    display: flex; align-items: center; gap: 6px;
  }
  .mini-btns button:hover { border-color: var(--acc2); }
  #modes { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #modes .btn { padding: 9px 15px; font-size: 13.5px; cursor: pointer; pointer-events: auto; user-select: none; display: inline-flex; align-items: center; gap: 7px; }
  #modes .btn.active { background: var(--gold); color: #1c1500; border-color: transparent; }
  #msg {
    position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%); z-index: 11;
    font-size: clamp(26px,5vw,46px); font-weight: 900; letter-spacing: -1px; color: #fff;
    text-shadow: 0 4px 30px rgba(0,0,0,.6); pointer-events: none; opacity: 0; transition: opacity .4s; text-align: center;
  }
  #countdown {
    position: fixed; top: 38%; left: 50%; transform: translate(-50%,-50%); z-index: 12;
    font-size: clamp(70px,14vw,150px); font-weight: 900; color: var(--gold);
    text-shadow: 0 6px 50px rgba(255,203,71,.45); pointer-events: none; opacity: 0; transition: opacity .15s;
  }
  #endcard {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 13; display: none;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 20px;
    padding: 30px 40px; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 20px 80px rgba(0,0,0,.6);
  }
  #endcard h2 { margin: 0 0 6px; font-size: 30px; }
  #endcard p { margin: 4px 0; color: var(--dim); }
  #endcard b { color: var(--gold); }
  #endcard .btn { margin-top: 14px; cursor: pointer; }
  #help {
    position: fixed; bottom: 18px; left: 18px; z-index: 9; color: var(--dim); font-size: 12.5px;
    background: rgba(11,16,32,0.7); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 14px; max-width: 270px;
  }
  #back { position: fixed; top: 68px; left: 18px; z-index: 10; }
  #touch { position: fixed; right: 16px; bottom: 90px; z-index: 10; display: none; grid-template-columns: repeat(3,58px); grid-auto-rows: 58px; gap: 6px; }
  #touch button {
    border-radius: 14px; border: 1px solid var(--edge); background: rgba(255,255,255,.08); color: #fff;
    touch-action: none; display: flex; align-items: center; justify-content: center;
  }
  #touch button svg { width: 22px; height: 22px; }
  #touch .wide { grid-column: span 3; font-size: 14px; font-weight: 800; color: var(--gold); }
  @media (pointer: coarse) { #touch { display: grid; } #help { display: none; } }
  canvas { display: block; }
  .ic { width: 16px; height: 16px; flex: none; }
</style>
</head>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   TEAM ROBOTS LEGENDS — 3D SANDBOX v3
   5 games · cinematic tone mapping · pooled particles (zero
   per-frame allocations) · canvas-generated field textures ·
   XRP-style robot (2 drive wheels + caster + lean physics) ·
   SVG icon UI (no emojis) · sound · minimap · records
   ============================================================ */

/* ---------------- renderer / scene / camera ---------------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 190, 620);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1200);
let camYaw = Math.PI, camDist = 30, camPitch = 0.55, camMode = 0;   /* 0 chase 1 top 2 far */
let smoothX = 0, smoothZ = 0;

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1c2440, 0.85));
scene.add(new THREE.AmbientLight(0x33406b, 0.35));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.9);
sun.position.set(45, 90, 35);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.bias = -0.0004;
sun.shadow.camera.left = sun.shadow.camera.bottom = -110;
sun.shadow.camera.right = sun.shadow.camera.top = 110;
scene.add(sun);

/* stars for flavour (static, cheap) */
{
  const g = new THREE.BufferGeometry();
  const v = [];
  for (let i = 0; i < 400; i++) {
    const r = 320 + Math.random() * 200, a = Math.random() * Math.PI * 2, y = 40 + Math.random() * 220;
    v.push(Math.cos(a) * r, y, Math.sin(a) * r);
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8fa8ff, size: 1.6, transparent: true, opacity: 0.7 })));
}

/* ---------------- canvas-generated textures ---------------- */
function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function grassTexture() {
  return canvasTex(512, 720, (c, w, h) => {
    for (let i = 0; i < 10; i++) {
      c.fillStyle = i % 2 ? '#2f7d3a' : '#3a9450';
      c.fillRect(0, i * h / 10, w, h / 10 + 1);
    }
    for (let i = 0; i < 2600; i++) {
      c.fillStyle = Math.random() < .5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)';
      c.fillRect(Math.random() * w, Math.random() * h, 2, 2);
    }
    c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 4;
    c.strokeRect(w * 0.06, h * 0.045, w * 0.88, h * 0.91);
    c.beginPath(); c.moveTo(w * 0.06, h / 2); c.lineTo(w * 0.94, h / 2); c.stroke();
    c.beginPath(); c.arc(w / 2, h / 2, h * 0.13, 0, 7); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(w / 2, h / 2, 4, 0, 7); c.fill();
    const gw = w * 0.36, gh = h * 0.13;
    c.strokeRect(w / 2 - gw / 2, h * 0.045, gw, gh);
    c.strokeRect(w / 2 - gw / 2, h * 0.955 - gh, gw, gh);
  });
}

function asphaltTexture() {
  return canvasTex(512, 720, (c, w, h) => {
    c.fillStyle = '#3a3f4c'; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 3800; i++) {
      c.fillStyle = Math.random() < .5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.07)';
      c.fillRect(Math.random() * w, Math.random() * h, 2, 2);
    }
    c.strokeStyle = 'rgba(255,220,120,0.8)'; c.lineWidth = 5; c.setLineDash([26, 20]);
    c.beginPath(); c.moveTo(w / 2, 0); c.lineTo(w / 2, h); c.stroke(); c.setLineDash([]);
    c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 4;
    c.beginPath(); c.moveTo(w * 0.05, 0); c.lineTo(w * 0.05, h);
    c.moveTo(w * 0.95, 0); c.lineTo(w * 0.95, h); c.stroke();
  });
}

function dohyoTexture() {
  return canvasTex(512, 512, (c, w, h) => {
    const g = c.createRadialGradient(w / 2, h / 2, 20, w / 2, h / 2, w / 2);
    g.addColorStop(0, '#cda473'); g.addColorStop(0.72, '#b9895b');
    g.addColorStop(0.94, '#8a5f3c'); g.addColorStop(1, '#6d4a2e');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 3000; i++) {
      c.fillStyle = Math.random() < .5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)';
      c.fillRect(Math.random() * w, Math.random() * h, 2, 2);
    }
    c.strokeStyle = 'rgba(60,30,10,0.55)'; c.lineWidth = 6;
    c.beginPath(); c.arc(w / 2, h / 2, w * 0.46, 0, 7); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 3;
    c.beginPath(); c.arc(w / 2, h / 2, w * 0.42, 0, 7); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 5;
    [-1, 1].forEach(s => { c.beginPath(); c.moveTo(w / 2 + s * 26, h * 0.30); c.lineTo(w / 2 + s * 26, h * 0.70); c.stroke(); });
  });
}

function ballTexture() {
  return canvasTex(256, 128, (c, w, h) => {
    c.fillStyle = '#f4f6fb'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#151a2c';
    for (let i = 0; i < 6; i++) {
      const x = (i + 0.5) * w / 6, y = i % 2 ? h * 0.28 : h * 0.72;
      c.beginPath(); c.arc(x, y, 13, 0, 7); c.fill();
    }
    c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
  });
}

const TEX = { grass: grassTexture(), asphalt: asphaltTexture(), dohyo: dohyoTexture(), ball: ballTexture() };

/* ---------------- ground ---------------- */
const outerFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(700, 700),
  new THREE.MeshStandardMaterial({ color: 0x0d1226, roughness: 1 })
);
outerFloor.rotation.x = -Math.PI / 2; outerFloor.position.y = -0.06; outerFloor.receiveShadow = true;
scene.add(outerFloor);

const field = new THREE.Mesh(
  new THREE.PlaneGeometry(112, 158),
  new THREE.MeshStandardMaterial({ map: TEX.asphalt, roughness: 0.95 })
);
field.rotation.x = -Math.PI / 2; field.receiveShadow = true; scene.add(field);

function setFieldTexture(tex) {
  if (field.material.map !== tex) { field.material.map = tex; field.material.needsUpdate = true; }
}

/* dohyo (SUMO) */
const dohyo = new THREE.Mesh(
  new THREE.CylinderGeometry(43, 43.8, 1.6, 72),
  new THREE.MeshStandardMaterial({ map: TEX.dohyo, roughness: 0.85 })
);
dohyo.position.y = 0.8; dohyo.receiveShadow = true; dohyo.visible = false; scene.add(dohyo);
const ringEdge = new THREE.Mesh(new THREE.TorusGeometry(43, 0.8, 12, 72),
  new THREE.MeshBasicMaterial({ color: 0xffcb47 }));
ringEdge.rotation.x = Math.PI / 2; ringEdge.position.y = 1.6; ringEdge.visible = false; scene.add(ringEdge);

/* glowing boundary walls (soccer / drive) */
const walls = new THREE.Group(); scene.add(walls);
function buildWalls(hx, hz) {
  while (walls.children.length) walls.remove(walls.children[0]);
  const m = new THREE.MeshBasicMaterial({ color: 0x4f8cff, transparent: true, opacity: 0.16 });
  const edge = new THREE.MeshBasicMaterial({ color: 0x4f8cff, transparent: true, opacity: 0.55 });
  const mk = (w, d, x, z) => {
    const wl = new THREE.Mesh(new THREE.BoxGeometry(w, 6, d), m);
    wl.position.set(x, 3, z); walls.add(wl);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(w, 0.4, d + 0.3), edge);
    cap.position.set(x, 6.2, z); walls.add(cap);
  };
  mk(hx * 2 + 2, 2, 0, hz + 1); mk(hx * 2 + 2, 2, 0, -hz - 1);
  mk(2, hz * 2 + 2, hx + 1, 0); mk(2, hz * 2 + 2, -hx - 1, 0);
}

/* ---------------- XRP-style robot ---------------- */
function makeRobot(team, accent) {
  const g = new THREE.Group();
  const tilt = new THREE.Group(); g.add(tilt); g.userData.tilt = tilt;

  const chassis = new THREE.Mesh(new THREE.BoxGeometry(7.4, 2.6, 9.6),
    new THREE.MeshStandardMaterial({ color: 0xe9edf6, roughness: 0.5, metalness: 0.15 }));
  chassis.position.y = 2.9; chassis.castShadow = true; tilt.add(chassis);

  const plate = new THREE.Mesh(new THREE.BoxGeometry(7.9, 0.5, 10.1),
    new THREE.MeshStandardMaterial({ color: team, roughness: 0.45, metalness: 0.25 }));
  plate.position.y = 4.45; plate.castShadow = true; tilt.add(plate);

  const board = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.35, 3.1),
    new THREE.MeshStandardMaterial({ color: 0x1f7a3d, roughness: 0.35 }));
  board.position.set(0, 4.9, -2.4); tilt.add(board);
  const chip = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.22, 1.5),

/* ---------------- pooled particles (fixes stutter) ----------------
   One single THREE.Points with fixed buffers. burst() only writes
   into the ring buffer; zero geometry/material allocation per frame. */
const P_MAX = 500;
const pPos = new Float32Array(P_MAX * 3);
const pCol = new Float32Array(P_MAX * 3);
const pBase = new Float32Array(P_MAX * 3);
const pVel = new Float32Array(P_MAX * 3);
const pLife = new Float32Array(P_MAX);
const pLife0 = new Float32Array(P_MAX);
let pNext = 0;
for (let i = 0; i < P_MAX; i++) pPos[i * 3 + 1] = -999;

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const dotTex = canvasTex(64, 64, (c) => {
  const g = c.createRadialGradient(32, 32, 0, 32, 32, 30);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, 64, 64);
});
const pMat = new THREE.PointsMaterial({
  size: 2.1, map: dotTex, vertexColors: true, transparent: true,
  depthWrite: false, blending: THREE.AdditiveBlending
});
const pPoints = new THREE.Points(pGeo, pMat);
pPoints.frustumCulled = false;
scene.add(pPoints);

const _pc = new THREE.Color();
function burst(x, z, colorHex, n, power) {
  _pc.setHex(colorHex);
  for (let k = 0; k < n; k++) {
    const i = pNext; pNext = (pNext + 1) % P_MAX;
    pPos[i * 3] = x + (Math.random() - 0.5) * 2;
    pPos[i * 3 + 1] = 1.5 + Math.random() * 2.5;
    pPos[i * 3 + 2] = z + (Math.random() - 0.5) * 2;
    pVel[i * 3] = (Math.random() - 0.5) * power;
    pVel[i * 3 + 1] = Math.random() * power * 0.8 + 4;
    pVel[i * 3 + 2] = (Math.random() - 0.5) * power;
    pLife[i] = pLife0[i] = 0.7 + Math.random() * 0.5;
    pBase[i * 3] = _pc.r; pBase[i * 3 + 1] = _pc.g; pBase[i * 3 + 2] = _pc.b;
    pCol[i * 3] = _pc.r; pCol[i * 3 + 1] = _pc.g; pCol[i * 3 + 2] = _pc.b;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}
function stepParticles(dt) {
  let touched = false;
  for (let i = 0; i < P_MAX; i++) {
    if (pLife[i] <= 0) continue;
    touched = true;
    pLife[i] -= dt;
    if (pLife[i] <= 0) { pPos[i * 3 + 1] = -999; pCol[i * 3] = pCol[i * 3 + 1] = pCol[i * 3 + 2] = 0; continue; }
    pVel[i * 3 + 1] -= 28 * dt;
    pPos[i * 3] += pVel[i * 3] * dt;
    pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
    pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    const f = pLife[i] / pLife0[i];
    pCol[i * 3] = pBase[i * 3] * f; pCol[i * 3 + 1] = pBase[i * 3 + 1] * f; pCol[i * 3 + 2] = pBase[i * 3 + 2] * f;
  }
  if (touched) {
    pGeo.attributes.position.needsUpdate = true;
    pGeo.attributes.color.needsUpdate = true;
  }
}

/* ---------------- sound (WebAudio, no assets) ---------------- */
const SFX = { on: true, ctx: null, engine: null, engGain: null };
function audioInit() {
  if (SFX.ctx || !SFX.on) return;
  try {
    SFX.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = SFX.ctx.createOscillator(), g = SFX.ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 55; g.gain.value = 0.0;
    o.connect(g).connect(SFX.ctx.destination); o.start();
    SFX.engine = o; SFX.engGain = g;
  } catch (e) { SFX.on = false; }
}
function beep(freq, dur, type, vol) {
  if (!SFX.on || !SFX.ctx) return;
  const o = SFX.ctx.createOscillator(), g = SFX.ctx.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.08, SFX.ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, SFX.ctx.currentTime + dur);
  o.connect(g).connect(SFX.ctx.destination);
  o.start(); o.stop(SFX.ctx.currentTime + dur);
}
function jingle() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.1), i * 110)); }
function thud() { beep(90, 0.12, 'sawtooth', 0.12); }
function engine(speedRatio) {
  if (!SFX.on || !SFX.engGain) return;
  SFX.engine.frequency.value = 46 + speedRatio * 120;
  SFX.engGain.gain.value = 0.012 + speedRatio * 0.03;
}

/* ---------------- arcade physics ---------------- */
const KID = { ACC: 26, BRK: 40, TURN: 2.1, VMAX: 30, FRICT: 8 };

function stepHero(dt, vMax) {
  const k = S.keys;
  const fwd = (k['KeyW'] || k['ArrowUp'] ? 1 : 0) - (k['KeyS'] || k['ArrowDown'] ? 1 : 0);
  const turn = (k['KeyA'] || k['ArrowLeft'] ? 1 : 0) - (k['KeyD'] || k['ArrowRight'] ? 1 : 0);
  const brake = k['Space'];
  const boosting = k['ShiftLeft'] && S.energy > 0.02 && fwd > 0;
  if (boosting) { S.energy = Math.max(0, S.energy - 0.45 * dt); }
  else { S.energy = Math.min(1, S.energy + 0.14 * dt); }
  const acc = KID.ACC * (boosting ? 1.8 : 1), vm = vMax * (boosting ? 1.3 : 1);
  if (fwd > 0) S.v = Math.min(vm, S.v + acc * dt);
  else if (fwd < 0) S.v = Math.max(-vMax * 0.4, S.v - KID.ACC * dt);
  else if (brake) S.v -= Math.sign(S.v) * KID.BRK * dt;
  else S.v -= Math.sign(S.v) * Math.min(Math.abs(S.v), KID.FRICT * dt);
  if (boosting) S.v = Math.min(vm, S.v + acc * dt);
  S.boostLamp = boosting;
  S.w = turn * KID.TURN * (0.45 + 0.55 * Math.min(1, Math.abs(S.v) / vMax));
  S.h += S.w * dt;
  S.px += Math.sin(S.h) * S.v * dt;
  S.pz += Math.cos(S.h) * S.v * dt;
  if (boosting && Math.random() < 0.5) burst(S.px - Math.sin(S.h) * 5, S.pz - Math.cos(S.h) * 5, 0xffcb47, 1, 6);
}

function seek(h, targetX, targetZ, x, z, turnRate) {
  const want = Math.atan2(targetX - x, targetZ - z);
  const d = Math.atan2(Math.sin(want - h), Math.cos(want - h));
  return Math.max(-turnRate, Math.min(turnRate, d));
}

function driveBot(o, dt, speed, turnRate) {
  o.h += o.w * dt;
  o.v = o.v === undefined ? 0 : o.v;
  o.v += Math.sign(speed - o.v) * Math.min(Math.abs(speed - o.v), 30 * dt);
  o.x += Math.sin(o.h) * o.v * dt;
  o.z += Math.cos(o.h) * o.v * dt;
}

function collide(a, b, ra, rb, massA, massB, fx) {
  const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz) || 0.01;
  const ov = ra + rb - d;
  if (ov <= 0) return null;
  const nx = dx / d, nz = dz / d, push = ov / (1 / massA + 1 / massB);
  a.x -= nx * push / massA; a.z -= nz * push / massA;
  b.x += nx * push / massB; b.z += nz * push / massB;
  if (fx) { burst((a.x + b.x) / 2, (a.z + b.z) / 2, 0xffffff, 8, 16); camShake = 0.35; thud(); }
  return { nx, nz };
}

const heroObj = { x: 0, z: 0 }, foeObj = { x: 0, z: 0 }, ballObj = { x: 0, z: 0 },
      mateObj = { x: 0, z: 0 }, foe2Obj = { x: 0, z: 0 };

function kickBall(from, sp) {
  const n = collide(from, ballObj, R_BOT + 1.0, R_BALL, 1, 0.12);
  if (n) {
    S.bvx = -n.nx * sp; S.bvz = -n.nz * sp;
    beep(220 + Math.random() * 80, 0.08, 'square', 0.09);
    burst(S.bx, S.bz, 0xffffff, 5, 12);
  }
  return n;
}

function update(dt) {
  if (countdown > 0) {
    countdown -= dt;
    const n = Math.ceil(countdown - 0.2);
    ui.cd.textContent = countdown > 0.2 ? (n > 0 ? n : '') : 'GO!';
    ui.cd.style.opacity = 1;
    if (countdown <= 0.2 && countdown + dt > 0.2) { beep(880, 0.25, 'triangle', 0.12); }
    else if (Math.abs(countdown - Math.round(countdown)) < dt && n > 0) beep(440, 0.12, 'triangle', 0.1);
    if (countdown <= 0) { ui.cd.style.opacity = 0; }
    return;
  }
  if (S.done) { S.t += dt; return; }
  S.t += dt;
  const left = Math.max(0, S.dur - S.t);
  ui.energy.style.width = (S.energy * 100) + '%';

  if (mode === 'SUMO' || mode === 'SUMO2') {
    stepHero(dt, KID.VMAX);
    foeObj.x = S.fx; foeObj.z = S.fz;
    foe.w = seek(S.fh, S.px, S.pz, S.fx, S.fz, 1.6);
    const fd = Math.hypot(S.px - S.fx, S.pz - S.fz);
    driveBot(foeObj, dt, fd > 8 ? 23 : 0, 0);
    S.fx = foeObj.x; S.fz = foeObj.z; S.fv = foeObj.v;
    if (mode === 'SUMO2') {
      mateObj.x = S.mx; mateObj.z = S.mz;
      mate.w = seek(S.mh, S.fx, S.fz, S.mx, S.mz, 1.5);
      driveBot(mateObj, dt, Math.hypot(S.fx - S.mx, S.fz - S.mz) > 9 ? 21 : 0, 0);
      S.mx = mateObj.x; S.mz = mateObj.z; S.mv = mateObj.v;
      foe2Obj.x = S.f2x; foe2Obj.z = S.f2z;
      foe2.w = seek(S.f2h, S.px, S.pz, S.f2x, S.f2z, 1.5);
      driveBot(foe2Obj, dt, Math.hypot(S.px - S.f2x, S.pz - S.f2z) > 9 ? 21 : 0, 0);
      S.f2x = foe2Obj.x; S.f2z = foe2Obj.z; S.f2v = foe2Obj.v;
      collide(mateObj, foeObj, R_BOT, R_BOT, 0.9, 0.8, true);
      collide(heroObj, foe2Obj, R_BOT, R_BOT, 1, 0.8, true);
    }
    heroObj.x = S.px; heroObj.z = S.pz;
    collide(heroObj, foeObj, R_BOT, R_BOT, 1, 0.8, true);
    S.px = heroObj.x; S.pz = heroObj.z; S.fx = foeObj.x; S.fz = foeObj.z;

    const hr = Math.hypot(S.px, S.pz);
    if (hr > 41) { S.px *= 41 / hr; S.pz *= 41 / hr; S.v *= 0.3; }
    const mr = Math.hypot(S.mx || 0, S.mz || 0);
    if (mode === 'SUMO2' && mr > 41) { S.mx *= 41 / mr; S.mz *= 41 / mr; }
    const fr = Math.hypot(S.fx, S.fz);
    if (fr > 40.5) {
      if (mode === 'SUMO2') {
        const f2r = Math.hypot(S.f2x, S.f2z);
        if (f2r > 40.5) { win('TEAM WIN! Both rivals out!', S.score = 2); return; }
        S.score = 1; foe.visible = false;
      } else { win('YOU WIN! You pushed the rival out!', 1); return; }
    }
    if (left <= 0) {
      end(mode === 'SUMO2' && S.score === 1 ? '1 out of 2 — almost!' : 'DRAW — nobody left the ring');
    }
  }

  if (mode === 'SOCCER' || mode === 'SOCCER2') {
    stepHero(dt, KID.VMAX);
    S.bvx -= S.bvx * 1.2 * dt; S.bvz -= S.bvz * 1.2 * dt;
    S.bx += S.bvx * dt; S.bz += S.bvz * dt;
    foeObj.x = S.fx; foeObj.z = S.fz;
    const fd = Math.hypot(S.bx - S.fx, S.bz - S.fz);
    foe.w = seek(S.fh, S.bx, S.bz + 3, S.fx, S.fz, 1.7);
    driveBot(foeObj, dt, fd > 5 ? 21 : 0, 0);
    S.fx = foeObj.x; S.fz = foeObj.z; S.fv = foeObj.v;
    collide(foeObj, ballObj, R_BOT + 1.0, R_BALL, 0.9, 0.12, false);
    if (Math.hypot(S.bx - S.fx, S.bz - S.fz) < R_BOT + R_BALL + 1) {
      const kd = Math.hypot(0 - S.bx, 78 - S.bz) || 1;
      S.bvx += (0 - S.bx) / kd * 26; S.bvz += (78 - S.bz) / kd * 26;
      beep(160, 0.1, 'sawtooth', 0.08);
    }
    if (mode === 'SOCCER2') {
      mateObj.x = S.mx; mateObj.z = S.mz;
      mate.w = seek(S.mh, S.bx, S.bz, S.mx, S.mz, 1.6);
      driveBot(mateObj, dt, Math.hypot(S.bx - S.mx, S.bz - S.mz) > 6 ? 19 : 0, 0);
      S.mx = mateObj.x; S.mz = mateObj.z;
      kickBall(mateObj, 24);
      foe2Obj.x = S.f2x; foe2Obj.z = S.f2z;
      foe2.w = seek(S.f2h, S.bx, S.bz, S.f2x, S.f2z, 1.5);
      driveBot(foe2Obj, dt, Math.hypot(S.bx - S.f2x, S.bz - S.f2z) > 6 ? 19 : 0, 0);
      S.f2x = foe2Obj.x; S.f2z = foe2Obj.z;
      collide(mateObj, foe2Obj, R_BOT, R_BOT, 0.9, 0.9, true);
    }
    heroObj.x = S.px; heroObj.z = S.pz; ballObj.x = S.bx; ballObj.z = S.bz;
    kickBall(heroObj, Math.max(18, Math.hypot(S.bvx, S.bvz) + Math.abs(S.v) * 1.6 + 14));
    S.px = heroObj.x; S.pz = heroObj.z; S.bx = ballObj.x; S.bz = ballObj.z;
    collide(heroObj, foeObj, R_BOT, R_BOT, 1, 0.9, true);
    S.px = heroObj.x; S.pz = heroObj.z; S.fx = foeObj.x; S.fz = foeObj.z;

    if (S.bz < -76.8 && Math.abs(S.bx) < 15) {
      S.score++; S.bx = 0; S.bz = 6; S.bvx = 0; S.bvz = 0;
      jingle(); burst(0, 3, 0x22d3a8, 40, 26); show('GOAL!');
    }
    if (S.bz > 76.8 && Math.abs(S.bx) < 15) {
      S.concede++; S.bx = 0; S.bz = -6; S.bvx = 0; S.bvz = 0;
      beep(180, 0.3, 'sawtooth', 0.1); burst(0, 3, 0xff6b81, 30, 22); show('Conceded');
    }
    for (const o of [heroObj, foeObj, mateObj, foe2Obj]) {
      o.x = Math.max(-55, Math.min(55, o.x)); o.z = Math.max(-78, Math.min(78, o.z));
    }
    S.px = heroObj.x; S.pz = heroObj.z; S.fx = foeObj.x; S.fz = foeObj.z;
    if (mode === 'SOCCER2') { S.mx = mateObj.x; S.mz = mateObj.z; S.f2x = foe2Obj.x; S.f2z = foe2Obj.z; }
    if (S.bz > 78) { S.bz = 78; S.bvz *= -0.4; }
    if (S.bz < -78) { S.bz = -78; S.bvz *= -0.4; }
    if (Math.abs(S.bx) > 53) { S.bx = Math.sign(S.bx) * 53; S.bvx *= -0.4; }
    if (left <= 0) {
      const dif = S.score - S.concede;
      end(dif > 0 ? 'FINAL ' + S.score + '–' + S.concede + ' — VICTORY!'
        : dif < 0 ? 'FINAL ' + S.score + '–' + S.concede + ' — defeat, rematch?'
        : 'FINAL ' + S.score + '–' + S.concede + ' — draw');
    }
  }

  if (mode === 'DRIVE') {
    stepHero(dt, KID.VMAX * 0.8);
    if (S.pz < 8 && S.pz > -8) {
      const tgt = doorX[S.door];
      if (Math.abs(S.px - tgt) < 9) {
        S.score += 1; S.door = (S.door + 1) % 3;
        if (S.door === 0) S.laps += 1;
        beep(660, 0.1, 'triangle', 0.1); burst(S.px, 0, 0x22d3a8, 12, 18);
        placeDoors();
      }
    }
    if (Math.abs(S.px) > 55) { S.px = Math.sign(S.px) * 55; S.v *= 0.3; }
    if (S.pz > 78) { S.pz = 78; S.v *= 0.3; }
    if (S.pz < -78) { S.pz = -78; S.v *= 0.3; }
    if (left <= 0) end('Time! Doors: ' + S.score + ' · full laps: ' + S.laps);
  }

  if (msgT > 0) { msgT -= dt; if (msgT <= 0) show(''); }
}

function win(txt, sc) { setBest(mode, Math.max(getBest(mode), sc)); finish(txt, sc); }
function end(txt) { finish(txt, S.score); }
function finish(txt, sc) {
  S.done = true; show('');
  ui.endTitle.textContent = txt;
  ui.endDetail.innerHTML = mode.startsWith('SOCCER')
    ? 'goals <b>' + S.score + '</b> · conceded <b>' + S.concede + '</b>'
    : mode === 'DRIVE' ? 'doors <b>' + S.score + '</b> · laps <b>' + S.laps + '</b>' : 'score <b>' + sc + '</b>';
  const b = getBest(mode);
  const isRecord = sc > 0 && sc >= b && b <= sc;
  ui.endBest.textContent = 'personal best in ' + mode + ': ' + Math.max(b, sc) + (isRecord && sc === Math.max(b, sc) ? ' — NEW!' : '');
  ui.end.style.display = 'block';
  if (S.score > 0 || sc > 0) jingle();
}

let msgT = 0;
function show(t) { ui.msg.textContent = t; ui.msg.style.opacity = t ? 1 : 0; msgT = t ? 1.6 : 0; }

/* ---------------- minimap ---------------- */
function drawMini() {
  const W = 170, H = 120;
  mini.clearRect(0, 0, W, H);
  mini.fillStyle = 'rgba(16,23,54,0.9)'; mini.fillRect(0, 0, W, H);
  mini.strokeStyle = 'rgba(79,140,255,0.5)';
  const fx = 55, fz = 79;
  const map = (x, z) => [W / 2 + x / fx * (W / 2 - 6), H / 2 + z / fz * (H / 2 - 6)];
  if (mode === 'SUMO' || mode === 'SUMO2') {
    mini.beginPath(); mini.arc(W / 2, H / 2, 48, 0, 7); mini.stroke();
    mini.strokeStyle = 'rgba(255,203,71,0.9)'; mini.beginPath(); mini.arc(W / 2, H / 2, 52, 0, 7); mini.stroke();
  } else {
    mini.strokeRect(6, 6, W - 12, H - 12);
    if (mode.startsWith('SOCCER')) {
      mini.fillStyle = 'rgba(34,211,168,0.35)'; mini.fillRect(W / 2 - 20, 6, 40, 8);
      mini.fillStyle = 'rgba(255,107,129,0.35)'; mini.fillRect(W / 2 - 20, H - 14, 40, 8);
    }
    if (mode === 'DRIVE') doorX.forEach((dx, i) => {
      const [mx] = map(dx, 0);
      mini.fillStyle = i === S.door ? '#22d3a8' : '#4f8cff';
      mini.fillRect(mx - 6, H / 2 - 3, 12, 6);
    });
  }
  const dot = (x, z, c, r) => { const [mx, my] = map(x, z); mini.fillStyle = c; mini.beginPath(); mini.arc(mx, my, r, 0, 7); mini.fill(); };
  if (mode === 'SUMO' || mode === 'SUMO2') {
    dot(S.px, S.pz, '#4f8cff', 5); dot(S.fx, S.fz, '#ff6b81', 5);
    if (mode === 'SUMO2') { dot(S.mx, S.mz, '#22d3a8', 4); dot(S.f2x, S.f2z, '#d98cff', 4); }
  } else {
    if (mode.startsWith('SOCCER')) dot(S.bx, S.bz, '#ffffff', 4);
    dot(S.px, S.pz, '#4f8cff', 5); dot(S.fx, S.fz, '#ff6b81', 4);
    if (mode === 'SOCCER2') { dot(S.mx, S.mz, '#22d3a8', 4); dot(S.f2x, S.f2z, '#d98cff', 4); }
  }
}

/* ---------------- render ---------------- */
function place(mesh, x, z, h) {
  mesh.position.set(x, S.baseY, z);
  if (h !== undefined) mesh.rotation.y = h;
}
function lean(mesh, w) {
  mesh.userData.tilt.rotation.z = Math.max(-0.22, Math.min(0.22, -w * 0.09));
}
function spinWheels(mesh, v, dt) {
  const spin = Math.abs(v) * dt * 0.6;
  mesh.userData.wheels.forEach(w => w.rotation.x += spin * Math.sign(v || 1));
}

let blinkT = 0;
function render() {
  requestAnimationFrame(render);
  const dt = Math.min(0.05, clock.getDelta());
  update(dt);
  stepParticles(dt);
  drawMini();

  place(hero, S.px, S.pz, S.h);
  spinWheels(hero, S.v, dt);
  lean(hero, S.w);
  blinkT += dt;
  const ledOn = (blinkT * 2 % 1) < 0.5;
  hero.userData.led.material.color.setHex(ledOn ? 0xff4757 : 0x571119);
  if (mode === 'SUMO' || mode === 'SUMO2') {
    place(foe, S.fx, S.fz, S.fh);
    spinWheels(foe, S.fv || 0, dt);
    if (mode === 'SUMO2') {
      place(mate, S.mx, S.mz, S.mh);
      place(foe2, S.f2x, S.f2z, S.f2h);
    }
  }
  if (mode === 'SOCCER' || mode === 'SOCCER2') {
    place(foe, S.fx, S.fz, S.fh);
    spinWheels(foe, S.fv || 0, dt);
    ball.position.set(S.bx, 3.2, S.bz);
    ball.rotation.x -= (S.bvz || 0) * dt / 3.2;
    ball.rotation.z += (S.bvx || 0) * dt / 3.2;
    if (mode === 'SOCCER2') { place(mate, S.mx, S.mz, S.mh); place(foe2, S.f2x, S.f2z, S.f2h); }
  }
  if (mode === 'DRIVE' && doors.visible) {
    doors.children.forEach((d, i) => {
      d.material.emissiveIntensity = 0.35 + (i === S.door ? 0.3 * Math.sin(blinkT * 6) * 0.5 + 0.3 : 0);
    });
  }

  /* camera — smoothed follow */
  const k = Math.min(1, dt * 6);
  smoothX += (S.px - smoothX) * k;
  smoothZ += (S.pz - smoothZ) * k;
  let cx, cy, cz, dist = camDist, pitch = camPitch;
  if (camMode === 1) { pitch = 1.34; dist = Math.min(camDist, 55); }
  if (camMode === 2) { dist = camDist * 1.8; pitch = Math.max(camPitch, 0.8); }
  cx = smoothX + Math.sin(camYaw) * dist * Math.cos(pitch);
  cz = smoothZ + Math.cos(camYaw) * dist * Math.cos(pitch);
  cy = 4 + Math.sin(pitch) * dist;
  if (camShake > 0) {
    camShake -= dt;
    cx += (Math.random() - 0.5) * camShake * 14;
    cy += (Math.random() - 0.5) * camShake * 10;
  }
  camera.position.set(cx, cy, cz);
  const wantFov = 60 + (S.boostLamp && !S.done && countdown <= 0 ? 8 : 0);
  camera.fov += (wantFov - camera.fov) * Math.min(1, dt * 8);
  camera.updateProjectionMatrix();
  camera.lookAt(smoothX, 2.5, smoothZ);
  engine(Math.min(1, Math.abs(S.v || 0) / KID.VMAX));

  ui.clock.textContent = countdown > 0 ? S.dur.toFixed(1) : (S.done ? '0.0' : Math.max(0, S.dur - S.t).toFixed(1));
  ui.scoreBox.innerHTML = mode.startsWith('SOCCER')
    ? '<svg class="ic"><use href="#i-ball"/></svg> <em>' + S.score + '</em> – <em style="color:#ff6b81">' + S.concede + '</em>'
    : mode === 'DRIVE' ? '<svg class="ic"><use href="#i-door"/></svg> <em>' + S.score + '</em> · <svg class="ic"><use href="#i-flag"/></svg> <em>' + S.laps + '</em>'
    : '<svg class="ic"><use href="#i-trophy"/></svg> <em>' + S.score + '</em>';
  ui.speed.textContent = (Math.abs(S.v || 0) / KID.VMAX).toFixed(2);

  renderer.render(scene, camera);
}
const clock = new THREE.Clock();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

reset('SUMO');
render();
</script>
</body>
</html>
